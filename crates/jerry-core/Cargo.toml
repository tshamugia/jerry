[package]
name = "jerry-core"
description = "Jerry's file core: listing, sorting, transfers, undo, search, storage. No COM, no Tauri, no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cargo bench` hands criterion's flags to every target it benchmarks; the lib has no benches.
bench = false

[dependencies]
rayon = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# StrCmpLogicalW (shlwapi, no COM): the reference the natural sort is tested against.
windows = { workspace = true, features = ["Win32_UI_Shell"] }

[[bench]]
name = "listing"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
