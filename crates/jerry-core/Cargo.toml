[package]
name = "jerry-core"
description = "Jerry's file core: listing, sorting, transfers, undo, search, storage. No COM, no Tauri, no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# StrCmpLogicalW (shlwapi, no COM): the reference the natural sort is tested against.
windows = { workspace = true, features = ["Win32_UI_Shell"] }

[lints]
workspace = true
