[workspace]
resolver = "3"
members = ["crates/jerry-core", "crates/jerry-win", "src-tauri"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jerry-core = { path = "crates/jerry-core" }
jerry-win = { path = "crates/jerry-win" }

# Benchmarks (#44). No plots: the CI job compares the numbers itself.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
    "rayon",
] }
proptest = "1"
rayon = "1"
# SQLite compiled in (no system library); rusqlite_migration 2.6 needs rusqlite 0.40.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-specta v2 is a release candidate: keep these three `=`-pinned and bump them together.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
# tracing-appender's subscriber: plain-text lines, target filters, and `log` records from Tauri.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "tracing-log",
] }
# WebView2 settings Tauri doesn't expose (browser keys off); the version wry already uses.
webview2-com = "0.39"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# CLAUDE.md: no unwrap/expect outside tests, no println!/dbg!, SAFETY comment on every unsafe block.
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind" # workers catch panics with catch_unwind; never switch to "abort"
strip = true
