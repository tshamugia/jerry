[package]
name = "jerry"
description = "Jerry, a fast keyboard-first file manager for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "jerry"

[lib]
# Not "jerry": a lib and a bin with the same name clash on Windows (cargo#8519).
name = "jerry_app"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
jerry-core = { workspace = true }
jerry-win = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-specta = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
webview2-com = { workspace = true }
# FindWindowW: is another Jerry running (#43)?
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
