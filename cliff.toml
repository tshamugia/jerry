# git-cliff turns Conventional Commits into CHANGELOG.md (`pnpm changelog`) and into the notes of
# each GitHub Release (.github/workflows/release.yml). Only what a Jerry user notices goes in:
# breaking changes, features, fixes and speed-ups. https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

What changed in each Jerry release. Generated from the commit history by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/tshamugia/jerry/releases/tag/{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif -%}
{% if commits | length == 0 %}
No changes a user would notice.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/tshamugia/jerry/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Merge commits and anything else that isn't a Conventional Commit stay out.
filter_unconventional = true
protect_breaking_commits = true
# Only a stable tag is a version here, so a stable release's notes include what its pre-releases had.
tag_pattern = "^v[0-9]+[.][0-9]+[.][0-9]+$"
sort_commits = "oldest"
# The first match wins: a breaking feat goes under breaking changes, not features.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  # docs, chore, ci, test and refactor commits don't change what the user sees.
  { message = ".*", skip = true },
]
