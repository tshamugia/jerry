# PR titles become squash-merge commit messages, so they follow Conventional Commits too.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|chore|ci)(\([a-z0-9-]+\))?!?: [^ ]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be '<type>: <summary>' (Conventional Commits), type one of feat, fix, perf, refactor, test, docs, chore, ci. Got: $TITLE"
            exit 1
          fi
