# Builds the NSIS installer for a version tag and publishes it as a GitHub Release (release steps in
# CLAUDE.md). A tag with a pre-release part, such as v0.1.0-rc.1, makes a pre-release, which
# GitHub's /releases/latest (where the updater will read latest.json) never points to.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Bash stops at the first failing command; the default pwsh only checks the last one.
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the release and upload the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history back to the previous tag
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: The tag matches Cargo.toml and CHANGELOG.md
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jerry") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=Cargo.toml::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $version: run pnpm changelog --tag $GITHUB_REF_NAME"
            exit 1
          fi

      # No caches in this workflow: a release is built from scratch, never from another run's files.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Release notes
        id: notes
        run: |
          # git-cliff counts only stable tags as versions (cliff.toml): to it an rc is still unreleased.
          case "$GITHUB_REF_NAME" in
            *-*) range=(--unreleased --tag "$GITHUB_REF_NAME") ;;
            *) range=(--latest) ;;
          esac
          {
            echo 'body<<RELEASE_NOTES_EOF'
            pnpm exec git-cliff "${range[@]}" --strip header
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Builds with `pnpm tauri build` (release profile, NSIS only), creates the release and uploads
      # Jerry_<version>_x64-setup.exe, its .sig and latest.json for the updater (#46). The signed
      # packages are switched on only here, by release.conf.json: the key is a release secret, and
      # `pnpm build` has to work without it.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Jerry ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
